services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_NAME: biblio
      DB_USER: app_user
      DB_PASSWORD: motdepasse123
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: biblio
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: motdepasse123
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d biblio"]
      interval: 5s
      timeout: 5s
      retries: 5
